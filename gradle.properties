# PulseForge AI build settings. Memory values are deliberately modest so the build also works on
# low-spec CI machines and small containers.
org.gradle.jvmargs=-Xmx850m -XX:MaxMetaspaceSize=520m -XX:ReservedCodeCacheSize=80m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
