name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate APK fixtures
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make-fixtures.py

      - name: Fetch Robolectric runtime
        run: bash tools/fetch-robolectric.sh

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace

      - name: Assemble debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Verify the APK declares no INTERNET permission
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" > permissions.txt
          cat permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::PulseForge must not request INTERNET"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pulseforge-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
